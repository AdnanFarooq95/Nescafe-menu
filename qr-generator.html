<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nescafé — QR Code Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0907;
      --bg2: #1a110d;
      --card: rgba(42, 26, 18, 0.65);
      --border: rgba(212, 165, 116, 0.12);
      --text: #faf3eb;
      --text2: #c4a882;
      --text3: #8a7060;
      --accent: #d4a574;
      --red: #c8102e;
      --red-dark: #9a0c22;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(200,16,46,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(212,165,116,0.06) 0%, transparent 50%);
      z-index: -1;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .logo {
      text-align: center;
      margin-bottom: 12px;
    }

    .logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
    }

    .logo h1 span { color: var(--red); }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text3);
      margin-bottom: 40px;
    }

    .input-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .input-section label {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      margin-bottom: 10px;
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    .input-row input {
      flex: 1;
      padding: 14px 18px;
      background: rgba(13,9,7,0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212,165,116,0.1);
    }

    .input-row input::placeholder { color: var(--text3); }

    .generate-btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      border: none;
      border-radius: 12px;
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(200,16,46,0.3);
      white-space: nowrap;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(200,16,46,0.45);
    }

    .help-text {
      font-size: 0.75rem;
      color: var(--text3);
      margin-top: 12px;
      line-height: 1.6;
    }

    .help-text a { color: var(--accent); text-decoration: none; }

    /* QR Output */
    .qr-output {
      display: none;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .qr-output.visible { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .qr-card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      margin-bottom: 24px;
    }

    .qr-card .qr-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a0e0a;
    }

    .qr-card .qr-logo span { color: var(--red); }

    #qr-canvas {
      border-radius: 12px;
    }

    .qr-card .scan-text {
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a0e0a;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .qr-card .scan-subtext {
      font-size: 0.75rem;
      color: #8a7060;
      margin-top: -8px;
    }

    .qr-url {
      font-size: 0.78rem;
      color: var(--text3);
      word-break: break-all;
      margin-bottom: 16px;
    }

    .action-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: white;
      border: none;
      box-shadow: 0 2px 15px rgba(200,16,46,0.3);
    }

    .action-btn.secondary {
      background: var(--card);
      color: var(--text);
    }

    .action-btn:hover { transform: translateY(-2px); }

    /* Print Styles */
    .print-section {
      display: none;
      margin-top: 32px;
      animation: fadeIn 0.4s ease;
    }

    .print-section.visible { display: block; }

    .print-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 16px;
    }

    .print-card-mini {
      background: white;
      border-radius: 16px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .print-card-mini .mini-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: #1a0e0a;
    }

    .print-card-mini .mini-logo span { color: var(--red); }

    .print-card-mini canvas { border-radius: 8px; }

    .print-card-mini .mini-text {
      font-family: 'Outfit', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      color: #1a0e0a;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .print-label {
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      color: var(--text2);
      margin-top: 16px;
      text-align: center;
    }

    @media print {
      body {
        background: white !important;
        padding: 0 !important;
      }
      body::before { display: none !important; }
      .input-section,
      .subtitle,
      .logo,
      .action-btns,
      .qr-url,
      .help-text,
      .print-label { display: none !important; }

      .qr-output { display: block !important; }
      .qr-card { box-shadow: none !important; border: 2px solid #eee; }

      .print-section {
        display: block !important;
        page-break-before: always;
      }
      .print-card-mini {
        border: 1px solid #ddd;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <h1>NES<span>CAFÉ</span></h1>
    </div>
    <p class="subtitle">QR Code Generator — Create printable QR codes for your café tables</p>

    <div class="input-section">
      <label>Menu URL</label>
      <div class="input-row">
        <input type="url" id="url-input" placeholder="https://your-cafe-menu.com" value="">
        <button class="generate-btn" id="generate-btn" onclick="generateQR()">Generate</button>
      </div>
      <p class="help-text">
        Enter the URL where your menu is hosted. You can host the menu folder on
        <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>,
        <a href="https://www.netlify.com/" target="_blank">Netlify</a>, or
        <a href="https://vercel.com/" target="_blank">Vercel</a> for free.
      </p>
    </div>

    <!-- QR Output -->
    <div class="qr-output" id="qr-output">
      <div class="qr-card" id="qr-card">
        <div class="qr-logo">NES<span>CAFÉ</span></div>
        <canvas id="qr-canvas"></canvas>
        <div class="scan-text">Scan for Menu</div>
        <div class="scan-subtext">Point your phone camera here</div>
      </div>

      <p class="qr-url" id="qr-url-display"></p>

      <div class="action-btns">
        <button class="action-btn primary" onclick="downloadQR()">
          📥 Download QR
        </button>
        <button class="action-btn secondary" onclick="showPrintView()">
          🖨️ Print Cards
        </button>
        <button class="action-btn secondary" onclick="downloadFullCard()">
          🎴 Download Card
        </button>
      </div>
    </div>

    <!-- Print Grid -->
    <div class="print-section" id="print-section">
      <p class="print-label">Table cards — print and cut along edges</p>
      <div class="print-grid" id="print-grid">
        <!-- JS fills 4 mini cards -->
      </div>
      <div class="action-btns" style="margin-top: 20px;">
        <button class="action-btn primary" onclick="window.print()">🖨️ Print Now</button>
      </div>
    </div>
  </div>

  <!-- QR Code library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script>
    function generateQR() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) {
        alert('Please enter a valid URL');
        return;
      }

      const canvas = document.getElementById('qr-canvas');

      QRCode.toCanvas(canvas, url, {
        width: 220,
        margin: 2,
        color: { dark: '#1a0e0a', light: '#ffffff' },
        errorCorrectionLevel: 'H'
      }, function(error) {
        if (error) {
          console.error(error);
          alert('Error generating QR code. Please check the URL.');
          return;
        }

        document.getElementById('qr-output').classList.add('visible');
        document.getElementById('qr-url-display').textContent = url;

        // Generate mini cards for print
        generatePrintCards(url);
      });
    }

    function generatePrintCards(url) {
      const grid = document.getElementById('print-grid');
      grid.innerHTML = '';

      for (let i = 0; i < 6; i++) {
        const card = document.createElement('div');
        card.className = 'print-card-mini';

        const logo = document.createElement('div');
        logo.className = 'mini-logo';
        logo.innerHTML = 'NES<span>CAFÉ</span>';

        const miniCanvas = document.createElement('canvas');

        const text = document.createElement('div');
        text.className = 'mini-text';
        text.textContent = 'Scan for Menu';

        card.appendChild(logo);
        card.appendChild(miniCanvas);
        card.appendChild(text);
        grid.appendChild(card);

        QRCode.toCanvas(miniCanvas, url, {
          width: 130,
          margin: 1,
          color: { dark: '#1a0e0a', light: '#ffffff' },
          errorCorrectionLevel: 'H'
        });
      }
    }

    function downloadQR() {
      const canvas = document.getElementById('qr-canvas');
      const link = document.createElement('a');
      link.download = 'nescafe-menu-qr.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadFullCard() {
      const card = document.getElementById('qr-card');
      // Use html2canvas approach — simple canvas export
      const canvas = document.getElementById('qr-canvas');
      
      // Create a new larger canvas with the full card design
      const exportCanvas = document.createElement('canvas');
      const ctx = exportCanvas.getContext('2d');
      const w = 400;
      const h = 520;
      exportCanvas.width = w;
      exportCanvas.height = h;

      // White background with rounded corners
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(0, 0, w, h, 24);
      ctx.fill();

      // Logo text
      ctx.fillStyle = '#1a0e0a';
      ctx.font = 'bold 28px "Playfair Display", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('NES', w/2 - 30, 60);
      ctx.fillStyle = '#c8102e';
      ctx.fillText('CAFÉ', w/2 + 32, 60);

      // QR code
      const qrSize = 220;
      const qrX = (w - qrSize) / 2;
      ctx.drawImage(canvas, qrX, 90, qrSize, qrSize);

      // Scan text
      ctx.fillStyle = '#1a0e0a';
      ctx.font = '600 16px "Outfit", sans-serif';
      ctx.letterSpacing = '3px';
      ctx.textAlign = 'center';
      ctx.fillText('SCAN FOR MENU', w/2, 350);

      // Subtitle
      ctx.fillStyle = '#8a7060';
      ctx.font = '400 12px "Inter", sans-serif';
      ctx.fillText('Point your phone camera here', w/2, 375);

      // Decorative line
      ctx.strokeStyle = '#d4a574';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(w/2 - 30, 400);
      ctx.lineTo(w/2 + 30, 400);
      ctx.stroke();

      // Coffee emoji
      ctx.font = '32px serif';
      ctx.fillText('☕', w/2, 445);

      // Footer
      ctx.fillStyle = '#c4a882';
      ctx.font = '400 10px "Inter", sans-serif';
      ctx.fillText('Freshly brewed, just for you', w/2, 485);

      const link = document.createElement('a');
      link.download = 'nescafe-table-card.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    }

    function showPrintView() {
      const section = document.getElementById('print-section');
      section.classList.toggle('visible');
      if (section.classList.contains('visible')) {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // Auto-generate if URL has hash
    window.addEventListener('load', () => {
      const hash = window.location.hash.slice(1);
      if (hash) {
        document.getElementById('url-input').value = decodeURIComponent(hash);
        generateQR();
      }
    });
  </script>
</body>
</html>
